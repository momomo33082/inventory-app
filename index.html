<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマート備品管理システム</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        /* カメラエリア */
        .scanner-section {
            background: var(--card);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            text-align: center;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        #canvas {
            width: 100%;
            display: block;
        }

        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.3);
        }

        /* テーブルエリア */
        .list-section {
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            background: #f1f5f9;
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 6px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
        }

        .delete-btn {
            color: #ef4444;
            cursor: pointer;
            border: none;
            background: none;
        }

        .status-msg {
            margin-top: 10px;
            font-weight: bold;
            color: var(--primary);
        }

        .export-btn {
            margin-top: 10px;
            padding: 10px 20px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i data-lucide="package"></i> スマート備品管理</h1>
        <p>バーコード/QRコードをカメラにかざしてください</p>
    </header>

    <div class="scanner-section">
        <div id="canvas-container">
            <canvas id="canvas"></canvas>
            <div class="scan-overlay"></div>
        </div>
        <div id="status" class="status-msg">スキャン待機中...</div>
        <button onclick="exportCSV()" class="export-btn">CSVで書き出し</button>
    </div>

    <div class="list-section">
        <table>
            <thead>
                <tr>
                    <th style="width: 15%;">日時</th>
                    <th style="width: 15%;">分類</th>
                    <th style="width: 20%;">商品名</th>
                    <th style="width: 10%;">数量</th>
                    <th style="width: 30%;">備考</th>
                    <th style="width: 10%;">操作</th>
                </tr>
            </thead>
            <tbody id="inventory-body">
                </tbody>
        </table>
    </div>
</div>

<script>
    const video = document.createElement("video");
    const canvasElement = document.getElementById("canvas");
    const canvas = canvasElement.getContext("2d");
    const statusMsg = document.getElementById("status");
    let inventory = JSON.parse(localStorage.getItem('inventory')) || [];

    // アイコン初期化
    lucide.createIcons();

    // カメラ設定
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(function(stream) {
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        video.play();
        requestAnimationFrame(tick);
    });

    function tick() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvasElement.height = video.videoHeight;
            canvasElement.width = video.videoWidth;
            canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
            
            const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert",
            });

            if (code) {
                processCode(code.data);
            }
        }
        requestAnimationFrame(tick);
    }

    let isProcessing = false;
    function processCode(data) {
        if (isProcessing) return;
        isProcessing = true;

        // QRコードのフォーマット想定: "分類,商品名"
        // 例: "事務用品,ボールペン"
        let category = "未分類";
        let name = data;

        if (data.includes(",")) {
            const parts = data.split(",");
            category = parts[0];
            name = parts[1];
        }

        const newItem = {
            id: Date.now(),
            timestamp: new Date().toLocaleString('ja-JP'),
            category: category,
            name: name,
            quantity: 1,
            memo: ""
        };

        inventory.unshift(newItem); // 先頭に追加
        saveAndRender();
        
        statusMsg.innerText = `読取完了: ${name}`;
        setTimeout(() => {
            statusMsg.innerText = "スキャン待機中...";
            isProcessing = false;
        }, 2000);
    }

    function updateItem(id, field, value) {
        const item = inventory.find(i => i.id === id);
        if (item) {
            item[field] = value;
            localStorage.setItem('inventory', JSON.stringify(inventory));
        }
    }

    function deleteItem(id) {
        if(confirm("このデータを削除しますか？")) {
            inventory = inventory.filter(i => i.id !== id);
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('inventory', JSON.stringify(inventory));
        const tbody = document.getElementById("inventory-body");
        tbody.innerHTML = "";

        inventory.forEach(item => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${item.timestamp}</td>
                <td><input type="text" value="${item.category}" onchange="updateItem(${item.id}, 'category', this.value)"></td>
                <td><input type="text" value="${item.name}" onchange="updateItem(${item.id}, 'name', this.value)"></td>
                <td><input type="number" value="${item.quantity}" onchange="updateItem(${item.id}, 'quantity', this.value)"></td>
                <td><input type="text" value="${item.memo}" placeholder="備考を入力" onchange="updateItem(${item.id}, 'memo', this.value)"></td>
                <td><button class="delete-btn" onclick="deleteItem(${item.id})"><i data-lucide="trash-2"></i></button></td>
            `;
            tbody.appendChild(tr);
        });
        lucide.createIcons();
    }

    function exportCSV() {
        let csvContent = "data:text/csv;charset=utf-8,日時,分類,商品名,数量,備考\n";
        inventory.forEach(item => {
            csvContent += `${item.timestamp},${item.category},${item.name},${item.quantity},${item.memo}\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "inventory_data.csv");
        document.body.appendChild(link);
        link.click();
    }

    // 初回レンダリング
    saveAndRender();

</script>

</body>
</html>
